[package]
name = "pico-10base-t-rs"
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
description = "Software 10BASE-T Ethernet (PIO bit-bang TX + RX) and a wireless router on the Raspberry Pi Pico 2 W (RP2350 Hazard3 RISC-V)"
authors = ["mattdeeds"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mattdeeds/pico-10base-t-rs"
readme = "README.md"
keywords = ["rp2350", "10base-t", "ethernet", "pio", "embedded"]
categories = ["embedded", "no-std", "network-programming"]

[features]
# Verbose 1 Hz CDC diagnostics ([Stitch], [Mac], hex dumps).
diag = []

# Experiment: open-loop decoder instead of the edge-track DPLL.
decoder-openloop = []

# Experiment: sample RX at 20 MHz (1 per half-bit); implies open-loop.
sample-rate-20mhz = ["decoder-openloop"]

# Experiment: stock 150 MHz sys_clk instead of the 240 MHz overclock.
clock-150mhz = []

# Experiment: HTTP :80 streams 1 MB for throughput tests.
http-bulk-test = []

# Experiment: full-duplex MAC with no carrier sense or CSMA/CA. Only safe
# when the peer is forced to 10M full duplex (docs/full-duplex-analysis.md §7).
full-duplex = []

# Experiment: TCP upload sink on :9999 and a [Sink] rate line.
fd-bench = []

# Experiment: 1000-byte MTU so peers send smaller segments.
mss-clamp = []

# WAN DHCP client, ping, and DNS in the blocking NIC loop.
wan-dhcp = [
    "smoltcp/socket-dhcpv4",
    "smoltcp/socket-icmp",
    "smoltcp/socket-dns",
]

# Router: cyw43 LAN + 10BASE-T WAN with forwarding and NAPT.
router = [
    "wireless",
    "smoltcp/socket-dhcpv4",
    "smoltcp/socket-icmp",
    "smoltcp/socket-dns",
]

# Library: smoltcp device over cyw43, without the executor or time runtime.
cyw43-phy = ["dep:cyw43", "dep:embassy-net-driver"]

# cyw43 wireless AP on the Pico 2 W (embassy executor, custom time driver).
wireless = [
    "cyw43-phy",
    "dep:cyw43",
    "dep:embassy-executor",
    "dep:embassy-time",
    "dep:embassy-time-driver",
    "dep:embassy-time-queue-utils",
    "dep:embassy-sync",
    "dep:embassy-net-driver",
    "smoltcp/proto-dhcpv4", # DHCP codec for the LAN server
]

[dependencies]
critical-section = "1.2.0"
cyw43 = { version = "0.7.0", default-features = false, optional = true }
# Wireless stack (optional). Versions match what cyw43 0.7.0 requires.
embassy-executor = { version = "0.10.0", default-features = false, features = [
    "platform-riscv32",
    "executor-thread",
], optional = true }
# Fixed 16-slot timer queue that works with our hand-rolled time driver.
embassy-time = { version = "0.5.1", features = [
    "tick-hz-1_000_000",
    "generic-queue-16",
], optional = true }
embassy-time-driver = { version = "0.2.2", optional = true }
embassy-time-queue-utils = { version = "0.3.2", optional = true }
embassy-sync = { version = "0.8.0", optional = true }
# Same version cyw43 0.7.0 uses, so the `Driver` trait types match.
embassy-net-driver = { version = "0.2.0", optional = true }
embedded-hal = "1.0.0"
fugit = "0.3.6"
heapless = "0.8.0"
nb = "1.0"
panic-halt = "0.2.0"
pio = "0.3.0"
rp235x-hal = { version = "0.4.0", features = [
    "binary-info",
    "critical-section-impl",
    "rt",
] }
smoltcp = { version = "0.13", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-udp",
    "socket-tcp",
    "auto-icmp-echo-reply",
] }
usb-device = "0.3.2"
usbd-serial = "0.2.2"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false
